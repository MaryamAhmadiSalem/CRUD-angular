<div dir="rtl" class="border">
    <link 
    href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <div class="round">
        <h1 style="right: 90px; position: absolute;">ثبت نام</h1>
    </div>
    <li>لطفا اطلاعات خود را وارد کنید</li>

    <label style="top: 280px; right: 60px;">نام:</label>
    <input type="text" [(ngModel)]= 'user.Fname'
    style="top: 280px; right: 165px;">

    <label style="top: 280px; right: 600px;">نام خانوادگی:</label>
    <input type="text" [(ngModel)]= 'user.Lname' 
    style="top: 280px; right: 710px;">

    <label style="top: 380px; right: 20px;">شماره دانشجویی:</label>
    <input type="number" [(ngModel)]= 'user.studentNumber' 
    style="top: 380px; right: 165px;">

    <label style="top: 380px; right: 590px;">رشته تحصیلی:</label>
    <input type="text" [(ngModel)]= 'user.course'
    style="top: 380px; right: 710px;">
    
    <input type="submit" value="ارسال" (click)="send()"
    style="top: 550px; right: 813px; height: 36px; width: 100px;
    background-color: #191970; color: #f5f6ff;">
</div>
